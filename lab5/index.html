<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Node.js - Server Side Logic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        label { display: block; margin-top: 1rem; font-weight: 500; color: #374151; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 0.5rem; margin-top: 0.25rem;
            border: 1px solid #d1d5db; border-radius: 0.375rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .btn {
            width: 100%; padding: 0.6rem; margin-top: 1.5rem;
            font-weight: 600; border: none; border-radius: 0.375rem;
            cursor: pointer; transition: background-color 0.2s;
        }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-secondary { background-color: #6b7280; color: white; }
        .btn-secondary:hover { background-color: #4b5563; }
        
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
        .btn-edit { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 0.4rem; font-weight: 500; border-radius: 0.375rem; }
        .btn-delete { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; padding: 0.4rem; font-weight: 500; border-radius: 0.375rem; }

        #total-result { margin-top: 1rem; padding: 1rem; background-color: #e5e7eb; border-radius: 0.375rem; text-align: center; font-weight: 600; color: #1f2937; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 100; display: none; justify-content: center; align-items: center; }
        .modal-visible { display: flex; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 0.5rem; width: 90%; max-width: 500px; position: relative; }
        .modal-close-btn { position: absolute; top: 0.75rem; right: 0.75rem; font-size: 1.5rem; cursor: pointer; }
        #loading-indicator { text-align: center; padding: 20px; font-size: 1.2rem; color: #6b7280; }
        #server-status { font-size: 0.8rem; padding: 0.25rem 0.5rem; border-radius: 4px; background-color: #e5e7eb; color: #374151; font-weight: 600; }
        .status-offline { background-color: #fff7ed !important; color: #9a3412 !important; border: 1px solid #fed7aa; }
        .status-online { background-color: #dcfce7 !important; color: #166534 !important; }
    </style>
</head>
<body class="p-8">

    <header class="mb-8 flex justify-between items-center">
        <h1 class="text-4xl font-bold text-gray-800">Музичні Кліпи (Server Filtering)</h1>
        <div id="server-status">Connecting...</div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="lg:col-span-1 bg-white p-6 rounded-lg shadow-lg h-fit">
            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Панель керування</h2>
            <button id="create-new-btn" class="btn btn-primary">Створити новий кліп</button>
            
            <div>
                <label for="search">Пошук (через сервер)</label>
                <input type="text" id="search-input" placeholder="Введіть назву...">
            </div>

            <div>
                <label for="sort">Сортувати (через сервер):</label>
                <select id="sort-select">
                    <option value="">За замовчуванням</option>
                    <option value="artist-asc">Виконавець (А-Я)</option>
                    <option value="artist-desc">Виконавець (Я-А)</option>
                    <option value="song-asc">Назва (А-Я)</option>
                    <option value="song-desc">Назва (Я-А)</option>
                    <option value="views-desc">Перегляди (макс.)</option>
                    <option value="views-asc">Перегляди (мін.)</option>
                    <option value="duration-desc">Тривалість (довші)</option>
                    <option value="duration-asc">Тривалість (коротші)</option>
                </select>
            </div>

            <div>
                <button id="count-total-btn" class="btn btn-secondary">Порахувати загальні перегляди</button>
                <div id="total-result" class="hidden"></div>
            </div>
        </aside>

        <section class="lg:col-span-3">
            <div id="loading-indicator">Завантаження...</div>
            <div id="clips-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <div id="clip-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close-btn">&times;</span>
            <h2 id="modal-title" class="text-2xl font-bold mb-4">Заголовок</h2>
            <form id="clip-form" novalidate>
                <input type="hidden" id="clip-id-input">
                <div><label>Виконавець</label><input type="text" id="artist-input" required minlength="2"></div>
                <div><label>Назва пісні</label><input type="text" id="song-input" required minlength="2"></div>
                <div><label>Тривалість (сек)</label><input type="number" id="duration-input" required min="1"></div>
                <div><label>Перегляди</label><input type="number" id="views-input" required min="0"></div>
                <button type="submit" id="save-btn" class="btn btn-primary">Зберегти</button>
            </form>
        </div>
    </div>
    <div id="error-modal" class="modal-overlay"><div class="modal-content"><span id="error-close-btn" class="modal-close-btn">&times;</span><h2 class="text-2xl font-bold text-red-600 mb-4">Помилка</h2><p id="error-message"></p></div></div>

    <script>
        const API_URL = 'http://localhost:3000/api/clips';
        let displayedClips = [];
        
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const container = document.getElementById('clips-container');
        const loadingIndicator = document.getElementById('loading-indicator');
        const serverStatus = document.getElementById('server-status');
        const totalResult = document.getElementById('total-result');

        const clipModal = document.getElementById('clip-modal');
        const errorModal = document.getElementById('error-modal');
        const clipForm = document.getElementById('clip-form');
        
        function showErrorModal(msg) {
            document.getElementById('error-message').textContent = msg;
            errorModal.classList.add('modal-visible');
        }

        async function fetchClips() {
            loadingIndicator.style.display = 'block';

            const searchValue = searchInput.value;
            const sortValue = sortSelect.value;

            const url = new URL(API_URL);
            if (searchValue) url.searchParams.append('search', searchValue);
            if (sortValue) url.searchParams.append('sort', sortValue);

            try {
                console.log(`Sending request to: ${url}`);

                const response = await fetch(url);
                if (!response.ok) throw new Error('Помилка сервера');
                
                displayedClips = await response.json();
                
                serverStatus.textContent = "🟢 Server Online";
                serverStatus.className = "status-online";
                renderClips(displayedClips);
            } catch (error) {
                console.error(error);
                serverStatus.textContent = "🔴 Server Error";
                serverStatus.className = "status-offline";
                container.innerHTML = '<p class="text-red-500 text-center col-span-3">Не вдалося отримати дані з сервера.</p>';
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        function formatDuration(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remaining = seconds % 60;
            return `${minutes}:${remaining.toString().padStart(2, '0')}`;
        }

        function renderClips(clips) {
            container.innerHTML = '';
            if (clips.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center col-span-3">Нічого не знайдено.</p>';
                return;
            }
            container.innerHTML = clips.map(clip => `
                <div class="bg-white p-5 rounded-lg shadow-md hover:shadow-xl flex flex-col justify-between">
                    <div>
                        <h3 class="text-2xl font-bold text-blue-600">${clip.artist}</h3>
                        <p class="text-xl text-gray-800 my-1">"${clip.song}"</p>
                        <div class="mt-3 text-gray-600">
                            <p><strong>Перегляди:</strong> ${clip.views.toLocaleString('uk-UA')}</p>
                            <p><strong>Тривалість:</strong> ${formatDuration(clip.duration)}</p>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-edit" data-id="${clip.id}">Редагувати</button>
                        <button class="btn-delete" data-id="${clip.id}">Видалити</button>
                    </div>
                </div>
            `).join('');
        }
        
        searchInput.addEventListener('input', fetchClips);
        
        sortSelect.addEventListener('change', fetchClips);

        async function createClip(data) {
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            fetchClips(); 
        }

        async function updateClip(id, data) {
            await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            fetchClips();
        }

        async function deleteClip(id) {
            if(!confirm("Видалити?")) return;
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchClips();
        }

        const openModal = (mode, id = null) => {
            clipForm.reset();
            clipForm.dataset.mode = mode;
            document.getElementById('clip-id-input').value = id || '';
            
            if (mode === 'edit') {
                const clip = displayedClips.find(c => String(c.id) === String(id));
                if (clip) {
                    document.getElementById('artist-input').value = clip.artist;
                    document.getElementById('song-input').value = clip.song;
                    document.getElementById('duration-input').value = clip.duration;
                    document.getElementById('views-input').value = clip.views;
                }
            }
            clipModal.classList.add('modal-visible');
        };
        const closeModal = () => clipModal.classList.remove('modal-visible');

        clipForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                artist: document.getElementById('artist-input').value,
                song: document.getElementById('song-input').value,
                duration: document.getElementById('duration-input').value,
                views: document.getElementById('views-input').value
            };
            const mode = clipForm.dataset.mode;
            closeModal();
            if (mode === 'create') await createClip(data);
            else await updateClip(document.getElementById('clip-id-input').value, data);
        });

        container.addEventListener('click', (e) => {
            const id = e.target.dataset.id;
            if (!id) return;
            if (e.target.classList.contains('btn-edit')) openModal('edit', id);
            else if (e.target.classList.contains('btn-delete')) deleteClip(id);
        });

        document.getElementById('create-new-btn').addEventListener('click', () => openModal('create'));
        document.getElementById('modal-close-btn').onclick = closeModal;
        document.getElementById('error-close-btn').onclick = () => errorModal.classList.remove('modal-visible');

        document.getElementById('count-total-btn').addEventListener('click', () => {
            const total = displayedClips.reduce((acc, curr) => acc + curr.views, 0);
            totalResult.textContent = `Сума переглядів (поточної вибірки): ${total.toLocaleString()}`;
            totalResult.classList.remove('hidden');
        });

        fetchClips();
    </script>
</body>
</html>
