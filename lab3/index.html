<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: #111827;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #6b7280;
            font-size: 1.1rem;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            align-items: flex-end;
        }

        .control-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button#count-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            height: 45px;
        }

        button#count-btn:hover {
            background-color: #2563eb;
        }

        #total-result {
            margin-top: 15px;
            text-align: center;
            font-weight: 700;
            color: #059669;
            background: #d1fae5;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        #total-result.visible {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            height: 8px;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
        }

        .card-body {
            padding: 25px;
        }

        .card h3 {
            margin: 0 0 5px 0;
            font-size: 1.25rem;
            color: #111827;
        }

        .card h4 {
            margin: 0 0 20px 0;
            color: #6b7280;
            font-weight: 500;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.9rem;
            color: #4b5563;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1> Менеджер Кліпів</h1>
            <p class="subtitle">Лабораторна №3: Фільтрація, Сортування та Підрахунок</p>
        </header>

        <aside class="controls">
            <div class="control-group">
                <label for="search-input">Пошук</label>
                <input type="text" id="search-input" placeholder="Введіть виконавця або пісню...">
            </div>

            <div class="control-group">
                <label for="sort-select">Сортування</label>
                <select id="sort-select">
                    <option value="default">-- За замовчуванням --</option>
                    <option value="views-desc"> Найпопулярніші (Більше -> Менше)</option>
                    <option value="views-asc"> Найменш популярні (Менше -> Більше)</option>
                    <option value="artist-asc"> Виконавець (А -> Я)</option>
                </select>
            </div>

            <div class="control-group">
                <button id="count-btn">Підрахувати перегляди</button>
                <div id="total-result"></div>
            </div>
        </aside>

        <main id="clips-container" class="grid-container">
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
